name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release tag must name the version being published (v1.2.3 for 1.2.3).
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+; npm 12 also keeps `npm stage` on hand
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm test
      - run: npm run build
      # No token: npm signs in with the trusted publisher set up on npmjs.com,
      # which must allow direct `npm publish` (not only staging).
      - run: npm publish --provenance --access public
